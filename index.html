<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPN Service PWA</title>
  
  <!-- Анти-кэш -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #f8f9fa; --bg-card: #ffffff; --text-primary: #1a1a1a;
      --text-secondary: #6b7280; --text-muted: #9ca3af; --border-color: #e5e7eb;
      --accent: #000000; --accent-hover: #333333; --success: #10b981;
      --warning: #f59e0b; --error: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'SN Pro', sans-serif; background: var(--bg-primary);
      color: var(--text-primary); min-height: 100vh; overflow-x: hidden;
    }
    
    /* Preloader */
    .preloader {
      position: fixed; inset: 0; background: var(--bg-primary);
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .preloader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-spinner {
      width: 40px; height: 40px; border: 3px solid var(--border-color);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loader-text { margin-top: 12px; font-size: 12px; color: var(--text-muted); }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Auth Overlay & Modal */
    .bg-pattern {
      position: fixed; inset: 0;
      background-image: radial-gradient(circle at 20% 50%, rgba(0,0,0,0.02) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }
    .auth-overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      z-index: 1000; background: rgba(248, 249, 250, 0.9); backdrop-filter: blur(8px);
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 0.4s ease, visibility 0s linear 0.4s;
    }
    .auth-overlay.visible { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity 0.4s ease, visibility 0s linear 0s; }
    
    .auth-modal {
      background: var(--bg-card); border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); overflow: hidden;
      width: 420px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      transform: scale(0.95) translateY(20px); position: relative;
    }
    .auth-overlay.visible .auth-modal { transform: scale(1) translateY(0); }
    
    .modal-header { padding: 24px 24px 0; position: relative; }
    .tab-container { position: relative; display: flex; padding: 2px; background-color: #e8e8e8; border-radius: 10px; }
    .tab-container .indicator { width: 50%; height: 36px; background: var(--bg-card); position: absolute; top: 2px; left: 2px; z-index: 9; border: 0.5px solid rgba(0, 0, 0, 0.04); box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.12); border-radius: 8px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .tab-container .tab { width: 50%; height: 36px; position: absolute; z-index: 99; outline: none; opacity: 0; cursor: pointer; }
    .tab-container .tab_label { width: 50%; height: 36px; position: relative; z-index: 999; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: color 0.3s ease; }
    .tab-container .tab:checked + .tab_label { color: var(--text-primary); }
    .tab-container .tab--register:checked ~ .indicator { left: 50%; }

    .modal-body { padding: 24px; padding-top: 28px; transition: padding 0.3s ease; }
    
    .forms-wrapper { position: relative; width: 100%; min-height: 250px; }
    .auth-form { display: flex; flex-direction: column; gap: 16px; width: 100%; position: absolute; top: 0; left: 0; transition: all 0.3s ease; }
    
    .login-form { z-index: 2; opacity: 1; visibility: visible; }
    .register-form { z-index: 1; opacity: 0; visibility: hidden; transform: translateX(30px); pointer-events: none; }
    
    .auth-modal.is-register .login-form { z-index: 1; opacity: 0; visibility: hidden; transform: translateX(-30px); pointer-events: none; }
    .auth-modal.is-register .register-form { z-index: 2; opacity: 1; visibility: visible; transform: translateX(0); pointer-events: auto; }

    .input-container { position: relative; width: 100%; }
    .styled_input_bar {
      width: 100%; padding: 14px 16px; font-size: 15px; font-family: 'SN Pro', sans-serif;
      border: 1.5px solid var(--border-color); border-radius: 12px;
      background-color: var(--bg-primary); color: var(--text-primary); outline: none;
      transition: all 0.3s ease;
    }
    .styled_input_bar:focus { border-color: var(--accent); background-color: var(--bg-card); box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05); }
    .input-label { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--text-muted); pointer-events: none; transition: all 0.3s ease; background: transparent; padding: 0 4px; }
    .styled_input_bar:focus + .input-label, .styled_input_bar:not(:placeholder-shown) + .input-label { top: 0; left: 12px; font-size: 12px; font-weight: 500; background-color: var(--bg-card); color: var(--accent); }

    .submit-btn { width: 100%; padding: 14px 24px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; margin-top: 8px; }
    .submit-btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .submit-btn:disabled { background: var(--text-muted); cursor: not-allowed; transform: none; }
    .submit-btn .loader { display: none; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .submit-btn.loading .btn-text { visibility: hidden; }
    .submit-btn.loading .loader { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }

    /* App Shell */
    .app-container {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .app-container.active { display: flex; }
    
    .vpn-card {
      background: var(--bg-card); padding: 40px; border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08); width: 100%; max-width: 400px;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      text-align: center;
    }
    
    .status-badge {
      padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 600;
      background: var(--bg-primary); color: var(--text-secondary);
    }
    .status-badge.active { background: rgba(16, 185, 129, 0.1); color: var(--success); }
    
    .vpn-btn {
      width: 100%; padding: 16px; border-radius: 14px; font-size: 15px; font-weight: 600;
      border: none; cursor: pointer; transition: all 0.2s ease; display: flex;
      align-items: center; justify-content: center; gap: 10px;
    }
    .vpn-btn.primary { background: var(--accent); color: white; }
    .vpn-btn.secondary { background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-color); }
    .vpn-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .key-display {
      width: 100%; padding: 12px; background: var(--bg-primary); border-radius: 10px;
      font-size: 12px; word-break: break-all; color: var(--text-muted); cursor: pointer;
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>

  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="loader-spinner"></div>
    <div class="loader-text" id="loaderText">Загрузка...</div>
  </div>

  <!-- Background Pattern -->
  <div class="bg-pattern"></div>

  <!-- AUTH OVERLAY -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-modal" id="authModal">
      <div class="modal-header">
        <div class="tab-container">
          <input type="radio" name="authTab" id="tabLogin" class="tab tab--login" checked />
          <label class="tab_label" for="tabLogin">Вход</label>
          <input type="radio" name="authTab" id="tabRegister" class="tab tab--register" />
          <label class="tab_label" for="tabRegister">Регистрация</label>
          <div class="indicator"></div>
        </div>
      </div>
      
      <div class="modal-body">
        <div class="forms-wrapper">
          <!-- Login Form -->
          <form class="auth-form login-form" id="loginForm">
            <div class="input-container">
              <input type="text" class="styled_input_bar" id="loginEmail" placeholder=" " autocomplete="email" />
              <label class="input-label" for="loginEmail">почта</label>
            </div>
            <div class="input-container">
              <input type="password" class="styled_input_bar" id="loginPass" placeholder=" " autocomplete="current-password" />
              <label class="input-label" for="loginPass">пароль</label>
            </div>
            <button type="submit" class="submit-btn" id="loginBtn"><span class="btn-text">войти</span><div class="loader"></div></button>
          </form>
          
          <!-- Register Form -->
          <form class="auth-form register-form" id="registerForm">
            <div class="input-container">
              <input type="email" class="styled_input_bar" id="regEmail" placeholder=" " autocomplete="email" />
              <label class="input-label" for="regEmail">ваша почта</label>
            </div>
            <button type="submit" class="submit-btn" id="registerBtn"><span class="btn-text">зарегистрироваться</span><div class="loader"></div></button>
            <p style="font-size: 12px; color: var(--text-muted); margin-top: 10px;">Пароль будет создан автоматически</p>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- APP CONTAINER -->
  <div class="app-container" id="appContainer">
    <div class="vpn-card">
      <h2 style="font-weight: 700; font-size: 24px;">VPN Service</h2>
      
      <div id="statusContainer">
        <span class="status-badge" id="statusBadge">Проверка статуса...</span>
      </div>

      <div style="width: 100%; display: flex; flex-direction: column; gap: 12px;">
        <button class="vpn-btn primary" id="buyBtn">
          <span class="material-symbols-outlined" style="font-size: 20px;">shopping_bag</span>
          <span id="buyBtnText">Купить подписку (30 дней)</span>
        </button>
        
        <button class="vpn-btn secondary" id="vpnBtn" disabled>
          <span class="material-symbols-outlined" style="font-size: 20px;">download</span>
          <span>Включить VPN (Скачать)</span>
        </button>
      </div>

      <div id="keyArea" style="display: none; width: 100%;">
        <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">Ссылка для продвинутых пользователей:</p>
        <div class="key-display" id="keyDisplay" onclick="copyKey()"></div>
      </div>

      <button class="vpn-btn secondary" style="margin-top: 20px; background: transparent; border: none; color: var(--text-muted);" onclick="logout()">
        Выйти из аккаунта
      </button>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURATION & VERSIONING
    // ==========================================
    const APP_VERSION = "1.0.7"; // Added config download logic
    const SUPABASE_URL = 'https://ncdwlmgwljjwpuawlssr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jZHdsbWd3bGpqd3B1YXdsc3NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0NTQxNDksImV4cCI6MjA4MzAzMDE0OX0.rrIznUflWydylTnUZvOxOkeF9eMp91qNN4Bjq2gXRL8';
    
    const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/VPN_Aleksander`;

    let supabaseClient = null;
    let currentUser = null;

    console.log(`%c APP VERSION: ${APP_VERSION} `, 'background: #222; color: #bada55; font-size: 16px;');

    // ==========================================
    // INIT & PRELOADER LOGIC
    // ==========================================
    
    setTimeout(() => {
      const preloader = document.getElementById('preloader');
      if (!preloader.classList.contains('hidden')) {
        preloader.classList.add('hidden');
        setTimeout(() => { document.getElementById('authOverlay').classList.add('visible'); }, 100);
      }
    }, 2000);

    try {
      if (typeof window.supabase !== 'undefined') {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
        console.log("Supabase initialized.");
      }
    } catch (e) { console.error("Init error:", e); }

    // ==========================================
    // UI INTERACTIONS
    // ==========================================
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const authModal = document.getElementById('authModal');

    tabLogin.addEventListener('change', () => { if(tabLogin.checked) authModal.classList.remove('is-register'); });
    tabRegister.addEventListener('change', () => { if(tabRegister.checked) authModal.classList.add('is-register'); });

    // ==========================================
    // HELPER: API CALL
    // ==========================================
    async function apiCall(action, payload) {
      const res = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
        body: JSON.stringify({ action, payload })
      });
      let data = {};
      try { data = await res.json(); } catch (e) { throw new Error(`Server error ${res.status}`); }
      if (!res.ok) throw new Error(data.error || `HTTP Error ${res.status}`);
      return data;
    }

    // ==========================================
    // LOGIC: REGISTER
    // ==========================================
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      const email = document.getElementById('regEmail').value.trim();
      if(!email) return alert("Введите почту");
      
      btn.classList.add('loading'); btn.disabled = true;
      try {
        const data = await apiCall('register', { email });
        document.getElementById('loginEmail').value = email;
        document.getElementById('loginPass').value = data.password;
        tabLogin.checked = true; authModal.classList.remove('is-register');
        alert(`Регистрация успешна! Пароль: ${data.password}\nВойдите в систему.`);
      } catch (err) { alert("Ошибка: " + err.message); } 
      finally { btn.classList.remove('loading'); btn.disabled = false; }
    });

    // ==========================================
    // LOGIC: LOGIN
    // ==========================================
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;

      btn.classList.add('loading'); btn.disabled = true;
      try {
        const data = await apiCall('login', { email, password: pass });
        currentUser = data.user;
        showApp();
      } catch (err) { alert("Ошибка входа: " + err.message); } 
      finally { btn.classList.remove('loading'); btn.disabled = false; }
    });

    // ==========================================
    // APP STATE
    // ==========================================
    function showApp() {
      document.getElementById('authOverlay').classList.remove('visible');
      setTimeout(() => { document.getElementById('appContainer').classList.add('active'); updateUI(); }, 400);
    }

    function logout() {
      currentUser = null;
      document.getElementById('appContainer').classList.remove('active');
      setTimeout(() => { document.getElementById('authOverlay').classList.add('visible'); }, 400);
    }

    function updateUI() {
      if(!currentUser) return;
      const now = Math.floor(Date.now() / 1000);
      const paidUntil = currentUser.paid_until || 0;
      const daysLeft = Math.max(0, Math.ceil((paidUntil - now) / 86400));
      
      const statusBadge = document.getElementById('statusBadge');
      const vpnBtn = document.getElementById('vpnBtn');
      const buyBtnText = document.getElementById('buyBtnText');
      const keyArea = document.getElementById('keyArea');

      statusBadge.textContent = `Осталось дней: ${daysLeft}`;

      if(daysLeft > 0) {
        statusBadge.classList.add('active');
        vpnBtn.disabled = false;
        buyBtnText.textContent = "Продлить (30 дней)";
        
        // Показываем ссылку
        if(currentUser.sub_id) {
           const subUrl = "https://x1.a2x2.top:14018/sub/" + currentUser.sub_id;
           document.getElementById('keyDisplay').textContent = subUrl;
           keyArea.style.display = 'block';
        }
      } else {
        statusBadge.classList.remove('active');
        vpnBtn.disabled = true;
        buyBtnText.textContent = "Купить подписку (30 дней)";
        keyArea.style.display = 'none';
      }
    }

    // ==========================================
    // ACTIONS: BUY
    // ==========================================
    document.getElementById('buyBtn').addEventListener('click', async () => {
      if(!currentUser) return;
      const btn = document.getElementById('buyBtn');
      const btnText = document.getElementById('buyBtnText');
      btnText.textContent = "Обработка..."; btn.disabled = true;

      try {
        const data = await apiCall('buy', { userId: currentUser.id });
        currentUser.paid_until = data.newPaidUntil;
        currentUser.sub_id = data.subUrl ? data.subUrl.split('/').pop() : currentUser.sub_id;
        if(data.subUrl) document.getElementById('keyDisplay').textContent = data.subUrl;
        alert("Оплата успешна! Подписка активирована.");
        updateUI();
      } catch (err) { alert("Ошибка: " + err.message); } 
      finally { btnText.textContent = "Купить подписку (30 дней)"; btn.disabled = false; }
    });

    // ==========================================
    // ACTIONS: VPN CONFIG DOWNLOAD (NEW LOGIC)
    // ==========================================
    document.getElementById('vpnBtn').addEventListener('click', async () => {
      if(!currentUser) return;
      const btn = document.getElementById('vpnBtn');
      const originalContent = btn.innerHTML;
      
      btn.innerHTML = `<span class="btn-text">Получение конфига...</span>`;
      btn.disabled = true;

      try {
        // 1. Запрашиваем конфиг у сервера
        const data = await apiCall('get-config', { userId: currentUser.id });
        
        if (data.config) {
          // 2. Создаем файл для скачивания
          const blob = new Blob([data.config], { type: 'text/plain' });
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'vpn_config.txt'; // Имя файла
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);

          // 3. Копируем ссылку в буфер (как резерв)
          if(data.subUrl) {
             try {
               await navigator.clipboard.writeText(data.subUrl);
               alert("Файл скачивается!\nСсылка также скопирована в буфер обмена.\n\nОткройте приложение VPN (например, Shadowrocket) и импортируйте файл или вставьте ссылку.");
             } catch(e) {
               alert("Файл скачивается!\nОткройте приложение VPN и импортируйте файл.");
             }
          } else {
             alert("Файл скачивается!\nОткройте приложение VPN и импортируйте файл.");
          }
        } else {
          throw new Error("Конфигурация пуста");
        }

      } catch (err) {
        console.error(err);
        alert("Не удалось получить конфиг: " + err.message);
      } finally {
        btn.innerHTML = originalContent;
        btn.disabled = false;
      }
    });

    function copyKey() {
      const key = document.getElementById('keyDisplay').textContent;
      navigator.clipboard.writeText(key).then(() => { alert("Ссылка скопирована!"); });
    }

  </script>
</body>
</html>
