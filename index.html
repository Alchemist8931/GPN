<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <title>VPN HIVE</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg:       #09090b;
      --bg-2:     #111113;
      --bg-3:     #19191d;
      --bg-card:  #141416;
      --border:   #27272a;
      --border-2: #3f3f46;
      --text:     #fafafa;
      --text-2:   #a1a1aa;
      --text-3:   #71717a;
      --accent:   #22d3ee;
      --accent-2: #06b6d4;
      --green:    #34d399;
      --green-bg: rgba(52,211,153,.1);
      --red:      #f87171;
      --red-bg:   rgba(248,113,113,.1);
      --amber:    #fbbf24;
      --amber-bg: rgba(251,191,36,.08);
      --radius:   14px;
      --t:        .3s cubic-bezier(.4,0,.2,1);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{height:100%}
    body{
      font-family:'Outfit',system-ui,sans-serif;
      background:var(--bg);color:var(--text);
      min-height:100%;display:flex;flex-direction:column;
      -webkit-font-smoothing:antialiased;overflow-x:hidden;
    }

    /* ===== NOISE TEXTURE OVERLAY ===== */
    body::before{
      content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
      opacity:.03;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ===== SUBTLE GLOW ===== */
    .glow{
      position:fixed;top:-30vh;left:50%;transform:translateX(-50%);
      width:80vw;height:60vh;border-radius:50%;
      background:radial-gradient(ellipse,rgba(34,211,238,.06) 0%,transparent 70%);
      pointer-events:none;z-index:0;
    }

    /* ===== PRELOADER ===== */
    .preloader{
      position:fixed;inset:0;background:var(--bg);
      display:flex;align-items:center;justify-content:center;
      z-index:9999;transition:opacity .6s ease,visibility .6s ease;
    }
    .preloader.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .preloader .ring{
      width:44px;height:44px;border:2.5px solid var(--border);
      border-top-color:var(--accent);border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ===== SCREENS ===== */
    .screen{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:24px;position:relative;z-index:1;
      opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s linear .5s;
    }
    .screen.visible{opacity:1;visibility:visible;transition:opacity .5s ease,visibility 0s linear 0s}
    .screen.app-screen{justify-content:flex-start;padding-top:56px}

    /* ===== AUTH SCREEN ===== */
    .auth-logo{margin-bottom:48px;text-align:center}
    .auth-logo h1{
      font-size:42px;font-weight:800;letter-spacing:-.04em;
      background:linear-gradient(135deg,var(--accent) 0%,#a78bfa 50%,var(--accent) 100%);
      background-size:200% 200%;animation:shimmer 4s ease infinite;
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    @keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
    .auth-logo p{font-size:15px;color:var(--text-3);margin-top:8px;font-weight:300;letter-spacing:.02em}

    .google-btn{
      display:flex;align-items:center;gap:14px;
      padding:16px 32px;background:var(--bg-card);border:1px solid var(--border);
      border-radius:16px;cursor:pointer;transition:all var(--t);
      font-family:inherit;font-size:15px;font-weight:500;color:var(--text);
      box-shadow:0 2px 12px rgba(0,0,0,.3);
    }
    .google-btn:hover{border-color:var(--border-2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
    .google-btn:active{transform:translateY(0)}
    .google-btn svg{width:20px;height:20px;flex-shrink:0}
    .google-btn.loading .g-text{opacity:.4}
    .google-btn .spin-small{display:none;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
    .google-btn.loading .spin-small{display:block}
    .google-btn.loading svg{display:none}

    .auth-footer{margin-top:32px;font-size:12px;color:var(--text-3);text-align:center;max-width:280px;line-height:1.6}

    /* ===== APP SCREEN ===== */
    .top-bar{
      display:flex;align-items:center;justify-content:space-between;
      width:100%;max-width:440px;margin-bottom:28px;
    }
    .top-bar .logo{font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--accent)}
    .user-pill{
      display:flex;align-items:center;gap:8px;
      padding:6px 12px 6px 6px;background:var(--bg-3);border:1px solid var(--border);
      border-radius:24px;cursor:pointer;transition:all var(--t);
    }
    .user-pill:hover{border-color:var(--border-2)}
    .user-pill img{width:28px;height:28px;border-radius:50%;object-fit:cover}
    .user-pill .uname{font-size:12px;color:var(--text-2);font-weight:500;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* Status Card */
    .status-card{
      width:100%;max-width:440px;background:var(--bg-card);
      border:1px solid var(--border);border-radius:20px;
      padding:28px;margin-bottom:16px;position:relative;overflow:hidden;
    }
    .status-card::before{
      content:'';position:absolute;top:0;right:0;width:200px;height:200px;
      background:radial-gradient(circle,rgba(34,211,238,.04) 0%,transparent 70%);
      pointer-events:none;
    }
    .status-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .status-label{font-size:13px;color:var(--text-3);font-weight:400}
    .chip{
      display:inline-flex;align-items:center;gap:6px;
      padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;
    }
    .chip.active{background:var(--green-bg);color:var(--green)}
    .chip.inactive{background:var(--red-bg);color:var(--red)}
    .chip.loading{background:var(--amber-bg);color:var(--amber)}
    .chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
    .days-num{font-size:48px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--text)}
    .days-label{font-size:13px;color:var(--text-3);margin-top:4px;font-weight:300}

    /* Action Buttons */
    .actions{width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px}

    .act-btn{
      display:flex;align-items:center;gap:14px;
      padding:16px 18px;background:var(--bg-card);
      border:1px solid var(--border);border-radius:var(--radius);
      cursor:pointer;transition:all var(--t);
      text-align:left;font-family:inherit;color:var(--text);
    }
    .act-btn:hover{border-color:var(--border-2);background:var(--bg-3)}
    .act-btn:disabled{opacity:.3;cursor:not-allowed;pointer-events:none}
    .act-btn .ico{
      width:42px;height:42px;border-radius:11px;
      display:flex;align-items:center;justify-content:center;
      font-size:18px;flex-shrink:0;
    }
    .act-btn .ico.pay{background:rgba(251,191,36,.1)}
    .act-btn .ico.dl{background:rgba(34,211,238,.1)}
    .act-btn .ico.cp{background:rgba(167,139,250,.1)}
    .act-title{font-size:14px;font-weight:600}
    .act-desc{font-size:12px;color:var(--text-3);margin-top:2px}

    /* Payment status bar */
    .pay-status{
      width:100%;max-width:440px;margin-top:12px;
      padding:14px 18px;background:var(--amber-bg);
      border:1px solid rgba(251,191,36,.15);border-radius:12px;
      font-size:13px;color:var(--amber);display:none;
      animation:pulse-border 2s ease infinite;
    }
    @keyframes pulse-border{0%,100%{border-color:rgba(251,191,36,.15)}50%{border-color:rgba(251,191,36,.35)}}

    /* ===== BOTTOM SHEET ===== */
    .overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
      z-index:5000;opacity:0;visibility:hidden;
      transition:opacity .3s ease,visibility 0s linear .3s;
    }
    .overlay.visible{opacity:1;visibility:visible;transition:opacity .3s ease,visibility 0s linear 0s}

    .sheet{
      position:fixed;bottom:0;left:0;right:0;
      background:var(--bg-2);border:1px solid var(--border);
      border-radius:20px 20px 0 0;border-bottom:none;
      padding:16px 20px 36px;z-index:5001;
      transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);
      max-height:80vh;overflow-y:auto;
    }
    .overlay.visible .sheet{transform:translateY(0)}

    .sheet-handle{width:36px;height:4px;background:var(--border-2);border-radius:2px;margin:0 auto 20px}
    .sheet h3{font-size:17px;font-weight:700;margin-bottom:6px}
    .sheet .sdesc{font-size:13px;color:var(--text-3);margin-bottom:20px;line-height:1.6}

    .app-row{
      display:flex;align-items:center;gap:14px;
      padding:14px 16px;border-radius:12px;
      background:var(--bg-3);border:1px solid var(--border);
      margin-bottom:8px;cursor:pointer;transition:all var(--t);
      border:none;width:100%;text-align:left;font-family:inherit;color:var(--text);
    }
    .app-row:hover{background:var(--bg-card);border-color:var(--border-2)}
    .app-row .aicon{
      width:38px;height:38px;border-radius:9px;
      display:flex;align-items:center;justify-content:center;
      font-size:15px;font-weight:700;flex-shrink:0;
      background:var(--accent);color:var(--bg);
    }
    .app-row .aname{font-size:14px;font-weight:600}
    .app-row .anote{font-size:11px;color:var(--text-3)}
    .app-row .arrow{color:var(--text-3);font-size:16px;margin-left:auto}

    .sheet-close{
      width:100%;padding:12px;margin-top:8px;
      background:transparent;border:1px dashed var(--border);
      border-radius:12px;cursor:pointer;font-family:inherit;
      font-size:13px;color:var(--text-3);transition:all var(--t);
    }
    .sheet-close:hover{border-color:var(--border-2);color:var(--text-2)}

    /* ===== TOAST ===== */
    .toast{
      position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);
      background:var(--bg-card);border:1px solid var(--border);color:var(--text);
      padding:12px 24px;border-radius:12px;font-size:13px;font-weight:500;
      z-index:9999;opacity:0;transition:all .35s ease;
      box-shadow:0 8px 32px rgba(0,0,0,.4);
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* ===== USER MENU ===== */
    .user-menu{
      position:fixed;top:70px;right:24px;
      background:var(--bg-2);border:1px solid var(--border);
      border-radius:12px;padding:6px;min-width:160px;
      box-shadow:0 12px 40px rgba(0,0,0,.5);
      z-index:3000;opacity:0;visibility:hidden;
      transform:translateY(-8px);transition:all .2s ease;
    }
    .user-menu.visible{opacity:1;visibility:visible;transform:translateY(0)}
    .user-menu button{
      display:block;width:100%;padding:10px 14px;
      background:transparent;border:none;border-radius:8px;
      font-family:inherit;font-size:13px;font-weight:500;
      color:var(--text-2);cursor:pointer;text-align:left;transition:all var(--t);
    }
    .user-menu button:hover{background:var(--bg-3);color:var(--red)}

    @media(max-width:480px){
      .days-num{font-size:40px}
      .auth-logo h1{font-size:36px}
    }
  </style>
</head>
<body>

  <div class="glow"></div>

  <!-- PRELOADER -->
  <div class="preloader" id="preloader"><div class="ring"></div></div>

  <!-- ===== AUTH SCREEN ===== -->
  <div class="screen" id="authScreen">
    <div class="auth-logo">
      <h1>VPN HIVE</h1>
      <p>Быстрый и приватный VPN</p>
    </div>

    <button class="google-btn" id="googleBtn" onclick="signInWithGoogle()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      <span class="g-text">Войти через Google</span>
      <div class="spin-small"></div>
    </button>

    <div class="auth-footer">
      Авторизуясь, вы получаете доступ к управлению VPN-подпиской
    </div>
  </div>

  <!-- ===== APP SCREEN ===== -->
  <div class="screen app-screen" id="appScreen">
    <div class="top-bar">
      <div class="logo">VPN</div>
      <div class="user-pill" id="userPill" onclick="toggleUserMenu()">
        <img id="userAvatar" src="" alt=""/>
        <span class="uname" id="userName"></span>
      </div>
    </div>

    <!-- User Menu -->
    <div class="user-menu" id="userMenu">
      <button onclick="logout()">Выйти из аккаунта</button>
    </div>

    <!-- Status -->
    <div class="status-card">
      <div class="status-row">
        <span class="status-label">Подписка</span>
        <span class="chip loading" id="statusChip">
          <span class="dot"></span>
          <span id="statusText">Проверка...</span>
        </span>
      </div>
      <div class="days-num" id="daysCount">—</div>
      <div class="days-label">дней осталось</div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="act-btn" id="payBtn">
        <div class="ico pay">⭐</div>
        <div>
          <div class="act-title" id="payTitle">Оплатить через Telegram Stars</div>
          <div class="act-desc">Быстрая оплата звёздами в Telegram</div>
        </div>
      </button>

      <button class="act-btn" id="downloadBtn" disabled>
        <div class="ico dl">📥</div>
        <div>
          <div class="act-title">Скачать конфигурацию</div>
          <div class="act-desc">Установить VPN-профиль на устройство</div>
        </div>
      </button>

      <button class="act-btn" id="copyBtn" disabled>
        <div class="ico cp">📋</div>
        <div>
          <div class="act-title">Скопировать Subscription URL</div>
          <div class="act-desc">Для ручного импорта в любой клиент</div>
        </div>
      </button>
    </div>

    <!-- Payment pending indicator -->
    <div class="pay-status" id="payStatus">⏳ Ожидание оплаты... Завершите оплату в Telegram и вернитесь сюда.</div>
  </div>

  <!-- ===== BOTTOM SHEET: App Picker ===== -->
  <div class="overlay" id="sheetOverlay">
    <div class="sheet" id="appSheet">
      <div class="sheet-handle"></div>
      <h3 id="sheetTitle">Выберите приложение</h3>
      <p class="sdesc" id="sheetDesc"></p>
      <div id="appList"></div>
      <button class="sheet-close" onclick="closeSheet()">Закрыть</button>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    // ==========================================
    // ⚙️  CONFIGURATION — ЗАПОЛНИТЕ СВОИ ЗНАЧЕНИЯ
    // ==========================================
    const SUPABASE_URL  = 'https://fyynjpglyacgxjoknteh.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5eW5qcGdseWFjZ3hqb2tudGVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg4OTMwMDQsImV4cCI6MjA4NDQ2OTAwNH0.E3Km0BprWfvJxjXBiKbfLsM2cvlSmpOmknJWGTahnco';
    const FUNCTION_URL  = `${SUPABASE_URL}/functions/v1/VPN_Aleksander`;
    const SUB_BASE      = 'https://x1.a2x2.top:14018/sub';
    const BOT_USERNAME  = 'VPN_HIVE_BOT';
    // ==========================================

    let sb = null;  // Supabase client
    let profile = null;
    let pollTimer = null;
    let currentPayToken = null;

    // ==========================================
    // SUPABASE INIT
    // ==========================================
    try {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
        auth: {
          autoRefreshToken: true,
          persistSession: true,
          detectSessionInUrl: true,
          flowType: 'implicit',
        }
      });
    } catch(e) { console.error('Supabase init error:', e); }

    // ==========================================
    // ON LOAD: check session
    // ==========================================
    window.addEventListener('load', async () => {
      // Небольшая задержка для красоты
      await new Promise(r => setTimeout(r, 600));

      if (!sb) {
        document.getElementById('preloader').classList.add('hidden');
        showScreen('auth');
        return;
      }

      const { data: { session } } = await sb.auth.getSession();

      document.getElementById('preloader').classList.add('hidden');

      if (session) {
        await enterApp(session);
      } else {
        showScreen('auth');
      }

      // Слушаем изменения авторизации (возврат после OAuth)
      sb.auth.onAuthStateChange(async (event, session) => {
        if (event === 'SIGNED_IN' && session && !profile) {
          await enterApp(session);
        }
        if (event === 'SIGNED_OUT') {
          profile = null;
          showScreen('auth');
        }
      });
    });

    // ==========================================
    // SCREENS
    // ==========================================
    function showScreen(name) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('visible'));
      document.getElementById(name === 'auth' ? 'authScreen' : 'appScreen').classList.add('visible');
    }

    // ==========================================
    // GOOGLE SIGN IN
    // ==========================================
    async function signInWithGoogle() {
      const btn = document.getElementById('googleBtn');
      btn.classList.add('loading');
      try {
        const { error } = await sb.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin + window.location.pathname,
          }
        });
        if (error) throw error;
        // Перенаправление на Google...
      } catch(e) {
        toast('Ошибка авторизации: ' + e.message);
        btn.classList.remove('loading');
      }
    }

    // ==========================================
    // ENTER APP (after auth)
    // ==========================================
    async function enterApp(session) {
      showScreen('app');

      // Set user info in UI
      const user = session.user;
      const meta = user.user_metadata || {};
      document.getElementById('userName').textContent = meta.full_name || meta.name || user.email || '';
      document.getElementById('userAvatar').src = meta.avatar_url || meta.picture || '';

      // Fetch profile from Edge Function
      try {
        const data = await apiCall(session.access_token, 'get-profile', {});
        profile = data.profile;
        updateUI();
      } catch(e) {
        console.error('get-profile error:', e);
        toast('Ошибка загрузки профиля');
      }
    }

    // ==========================================
    // API CALL (authenticated)
    // ==========================================
    async function apiCall(token, action, payload) {
      const res = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON,
          'Authorization': `Bearer ${token}`,
        },
        body: JSON.stringify({ action, payload })
      });
      let data = {};
      try { data = await res.json(); } catch(e) { throw new Error(`Server error ${res.status}`); }
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    async function getToken() {
      const { data: { session } } = await sb.auth.getSession();
      return session?.access_token || null;
    }

    // ==========================================
    // UPDATE UI
    // ==========================================
    function updateUI() {
      if (!profile) return;
      const now = Math.floor(Date.now() / 1000);
      const pu = profile.paid_until || 0;
      const days = Math.max(0, Math.ceil((pu - now) / 86400));
      const active = days > 0;

      const chip = document.getElementById('statusChip');
      chip.className = 'chip ' + (active ? 'active' : 'inactive');
      document.getElementById('statusText').textContent = active ? 'Активна' : 'Неактивна';
      document.getElementById('daysCount').textContent = days;

      document.getElementById('payTitle').textContent = active
        ? 'Продлить через Telegram Stars'
        : 'Оплатить через Telegram Stars';

      document.getElementById('downloadBtn').disabled = !active;
      document.getElementById('copyBtn').disabled = !active;
    }

    // ==========================================
    // PAYMENT: Telegram Stars
    // ==========================================
document.getElementById('payBtn').addEventListener('click', async () => {
  // 1. СРАЗУ открываем окно — синхронная реакция на клик, popup-blocker пропускает
  const win = window.open('about:blank', '_blank');

  const token = await getToken();
  if (!token) {
    if (win) win.close();
    return toast('Сессия истекла, войдите заново');
  }

  try {
    const data = await apiCall(token, 'create-payment', { plan: '1m' });
    currentPayToken = data.token;

    // 2. Очищаем pay-status от старых fallback-ссылок (если были)
    const payStatus = document.getElementById('payStatus');
    payStatus.innerHTML = '⏳ Ожидание оплаты... Завершите оплату в Telegram и вернитесь сюда.';
    payStatus.style.display = 'block';

    // 3. Открываем бота в нужной вкладке
    if (win && !win.closed) {
      // popup открылся — подменяем URL
      win.location.href = data.botUrl;
    } else {
      // popup заблокирован — показываем ссылку для ручного открытия
      const fallbackBtn = document.createElement('a');
      fallbackBtn.href = data.botUrl;
      fallbackBtn.target = '_blank';
      fallbackBtn.textContent = '👉 Открыть Telegram-бота';
      fallbackBtn.style.cssText = 'display:block;margin-top:12px;color:var(--accent);text-decoration:underline;font-weight:600;';
      payStatus.appendChild(fallbackBtn);
    }

    // 4. Запускаем поллинг
    startPaymentPolling(token, data.token);

  } catch(e) {
    if (win) win.close();
    toast('Ошибка: ' + e.message);
  }
});

    function startPaymentPolling(accessToken, payToken) {
      if (pollTimer) clearInterval(pollTimer);
      let attempts = 0;
      const maxAttempts = 120; // 10 минут (каждые 5 секунд)

      pollTimer = setInterval(async () => {
        attempts++;
        if (attempts > maxAttempts) {
          clearInterval(pollTimer);
          pollTimer = null;
          document.getElementById('payStatus').style.display = 'none';
          toast('Время ожидания оплаты истекло');
          return;
        }

        try {
          // Обновляем токен если нужно
          const freshToken = await getToken();
          if (!freshToken) return;

          const data = await apiCall(freshToken, 'check-payment', { token: payToken });

          if (data.paid) {
            clearInterval(pollTimer);
            pollTimer = null;
            document.getElementById('payStatus').style.display = 'none';
            profile = data.profile;
            updateUI();
            toast('Оплата прошла! Подписка активна.');
          }
        } catch(e) {
          console.error('Poll error:', e);
        }
      }, 5000);
    }

    // ==========================================
    // DOWNLOAD CONFIG (App Picker)
    // ==========================================
    document.getElementById('downloadBtn').addEventListener('click', () => openAppSheet());
    document.getElementById('copyBtn').addEventListener('click', () => copySubUrl());

    // ==========================================
    // PLATFORM DETECTION
    // ==========================================
    function getPlatform() {
      const ua = navigator.userAgent || '';
      if (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'ios';
      if (/android/i.test(ua)) return 'android';
      if (/Macintosh|MacIntel/.test(ua)) return 'mac';
      if (/Win/.test(ua)) return 'windows';
      return 'mac'; // fallback
    }

    // ==========================================
    // VPN APPS — 4 ПЛАТФОРМЫ
    // ==========================================
    const VPN_APPS = {
      ios: [
        {
          name: 'Streisand',
          note: 'Бесплатный, рекомендуем',
          icon: 'S',
          color: '#6366f1',
          scheme: 'streisand://import/',
          storeUrl: 'https://apps.apple.com/app/streisand/id6450534064',
        },
        {
          name: 'Hiddify',
          note: 'Мощный open-source клиент',
          icon: 'H',
          color: '#f59e0b',
          scheme: 'hiddify://import/',
          storeUrl: 'https://apps.apple.com/app/hiddify-proxy-vpn/id6596777532',
        },
      ],
      android: [
        {
          name: 'v2rayNG',
          note: 'Рекомендуем, бесплатный',
          icon: 'V',
          color: '#22c55e',
          scheme: 'v2rayng://install-config?url=',
          storeUrl: 'https://play.google.com/store/apps/details?id=com.v2ray.ang',
        },
        {
          name: 'Happ',
          note: 'Простой и удобный',
          icon: '✦',
          color: '#ec4899',
          scheme: '',  // clipboard-based
          storeUrl: 'https://play.google.com/store/search?q=happ+vpn&c=apps',
        },
      ],
      mac: [
        {
          name: 'Streisand',
          note: 'Рекомендуем для macOS',
          icon: 'S',
          color: '#6366f1',
          scheme: 'streisand://import/',
          storeUrl: 'https://apps.apple.com/app/streisand/id6450534064',
        },
        {
          name: 'V2RayXS',
          note: 'Легковесный GUI-клиент',
          icon: 'X',
          color: '#14b8a6',
          scheme: '',
          storeUrl: 'https://github.com/tzmax/V2RayXS/releases',
        },
      ],
      windows: [
        {
          name: 'Throne',
          note: 'Рекомендуем для Windows',
          icon: 'T',
          color: '#8b5cf6',
          scheme: '',
          storeUrl: 'https://github.com/ptrss/throne/releases',
        },
      ],
    };

    const PLATFORM_LABELS = {
      ios: 'iOS',
      android: 'Android',
      mac: 'macOS',
      windows: 'Windows',
    };

    // ==========================================
    // APP SHEET
    // ==========================================
    function openAppSheet() {
      const platform = getPlatform();
      const apps = VPN_APPS[platform] || VPN_APPS.mac;

      document.getElementById('sheetTitle').textContent = `Приложения для ${PLATFORM_LABELS[platform] || platform}`;

      const hasDeepLinks = apps.some(a => a.scheme);
      document.getElementById('sheetDesc').textContent = hasDeepLinks
        ? 'Нажмите на приложение для автоматического импорта конфигурации. Если не установлено — перейдёте в магазин.'
        : 'Скопируйте ссылку подписки и импортируйте в выбранное приложение.';

      const list = document.getElementById('appList');
      list.innerHTML = '';

      apps.forEach(app => {
        const el = document.createElement('button');
        el.className = 'app-row';
        el.innerHTML = `
          <div class="aicon" style="background:${app.color}">${app.icon}</div>
          <div style="flex:1">
            <div class="aname">${app.name}</div>
            <div class="anote">${app.note}</div>
          </div>
          <span class="arrow">→</span>
        `;
        el.addEventListener('click', () => openInApp(app));
        list.appendChild(el);
      });

      // Кнопка «Скачать файл»
      const dlBtn = document.createElement('button');
      dlBtn.className = 'app-row';
      dlBtn.style.marginTop = '8px';
      dlBtn.style.borderTop = '1px dashed var(--border)';
      dlBtn.innerHTML = `
        <div class="aicon" style="background:var(--bg-card);color:var(--text-2);border:1px solid var(--border)">📄</div>
        <div style="flex:1">
          <div class="aname">Скачать raw-файл конфигурации</div>
          <div class="anote">Универсальный способ — ручной импорт</div>
        </div>
        <span class="arrow">→</span>
      `;
      dlBtn.addEventListener('click', downloadRawConfig);
      list.appendChild(dlBtn);

      document.getElementById('sheetOverlay').classList.add('visible');
    }

    function closeSheet() {
      document.getElementById('sheetOverlay').classList.remove('visible');
    }

    document.getElementById('sheetOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeSheet();
    });

    // ==========================================
    // OPEN IN APP (deep link)
    // ==========================================
    function openInApp(app) {
      const subUrl = getSubUrl();
      if (!subUrl) return toast('Нет активной подписки');

      closeSheet();

      if (app.scheme) {
        let deepLink;
        if (app.scheme.includes('?url=')) {
          deepLink = app.scheme + encodeURIComponent(subUrl);
        } else {
          // streisand://import/URL  или  hiddify://import/URL
          deepLink = app.scheme + encodeURIComponent(subUrl);
        }

        const start = Date.now();
        window.location.href = deepLink;

        setTimeout(() => {
          if (Date.now() - start < 2500) {
            if (confirm(`${app.name} не установлен.\nОткрыть магазин приложений?`)) {
              window.open(app.storeUrl, '_blank');
            }
          }
        }, 1500);
      } else {
        // Нет deep link — копируем и предлагаем скачать
        navigator.clipboard.writeText(subUrl).then(() => {
          toast('Ссылка скопирована в буфер!');
          setTimeout(() => {
            if (confirm(`Ссылка скопирована.\nОткройте ${app.name} и импортируйте из буфера.\n\nСкачать ${app.name}?`)) {
              window.open(app.storeUrl, '_blank');
            }
          }, 400);
        }).catch(() => toast('Не удалось скопировать'));
      }
    }

    // ==========================================
    // DOWNLOAD RAW CONFIG
    // ==========================================
    async function downloadRawConfig() {
      closeSheet();
      const token = await getToken();
      if (!token) return toast('Сессия истекла');

      try {
        toast('Загрузка...');
        const data = await apiCall(token, 'get-config', {});
        if (!data.config) throw new Error('Пустая конфигурация');

        const blob = new Blob([data.config], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'vpn_config.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast('Файл скачан!');
      } catch(e) {
        toast('Ошибка: ' + e.message);
      }
    }

    // ==========================================
    // COPY SUB URL
    // ==========================================
    function getSubUrl() {
      return profile?.sub_id ? `${SUB_BASE}/${profile.sub_id}` : '';
    }

    function copySubUrl() {
      const url = getSubUrl();
      if (!url) return toast('Нет активной подписки');
      navigator.clipboard.writeText(url)
        .then(() => toast('Ссылка скопирована!'))
        .catch(() => {
          // fallback
          const ta = document.createElement('textarea');
          ta.value = url; ta.style.cssText = 'position:fixed;left:-9999px';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          toast('Ссылка скопирована!');
        });
    }

    // ==========================================
    // LOGOUT
    // ==========================================
    async function logout() {
      closeUserMenu();
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      profile = null;
      await sb.auth.signOut();
      showScreen('auth');
    }

    // ==========================================
    // USER MENU
    // ==========================================
    function toggleUserMenu() {
      document.getElementById('userMenu').classList.toggle('visible');
    }
    function closeUserMenu() {
      document.getElementById('userMenu').classList.remove('visible');
    }
    document.addEventListener('click', (e) => {
      const pill = document.getElementById('userPill');
      const menu = document.getElementById('userMenu');
      if (!pill.contains(e.target) && !menu.contains(e.target)) closeUserMenu();
    });

    // ==========================================
    // TOAST
    // ==========================================
    function toast(msg, ms = 2500) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), ms);
    }
  </script>
